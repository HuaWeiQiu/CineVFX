<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CineVFX</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="app" class="panel" data-theme="ps-dark">
      <header class="panel__header">
        <div class="panel__title-row">
          <h1 class="panel__title">CineVFX</h1>
          <span id="task-state-badge" class="badge badge--idle" aria-live="polite">空闲</span>
        </div>
        <p class="panel__subtitle">分层特效工作流（开发预览）</p>
      </header>

      <section class="panel__section panel__section--local" aria-labelledby="local-effect-title">
        <div class="section-heading">
          <h2 id="local-effect-title" class="section-heading__title">本地效果</h2>
          <span class="section-heading__note">非破坏性图层效果</span>
        </div>

        <div class="selection-row">
          <div class="selection-row__copy">
            <span class="field__label">当前图层</span>
            <strong id="local-layer-status" class="selection-row__status" aria-live="polite">
              正在读取...
            </strong>
            <span id="local-layer-meta" class="selection-row__meta">未读取安全元数据</span>
          </div>
          <button id="btn-refresh-layer" class="btn btn--compact" type="button">
            刷新
          </button>
        </div>

        <label class="field" for="glow-color">
          <span class="field__label">发光颜色</span>
          <input
            id="glow-color"
            class="field__input field__input--color-text"
            type="text"
            value="#FFD36A"
            maxlength="7"
            spellcheck="false"
            autocomplete="off"
          />
        </label>

        <div class="range-field">
          <label class="range-field__label" for="glow-intensity">强度</label>
          <input id="glow-intensity" class="range-field__input" type="range" min="0" max="100" value="70" />
          <output id="glow-intensity-value" class="range-field__value" for="glow-intensity">70%</output>
        </div>

        <div class="range-field">
          <label class="range-field__label" for="glow-spread">发光范围</label>
          <input id="glow-spread" class="range-field__input" type="range" min="1" max="250" value="36" />
          <output id="glow-spread-value" class="range-field__value" for="glow-spread">36 px</output>
        </div>

        <div class="range-field">
          <label class="range-field__label" for="glow-blur-radius">柔光半径</label>
          <input id="glow-blur-radius" class="range-field__input" type="range" min="1" max="250" value="18" />
          <output id="glow-blur-radius-value" class="range-field__value" for="glow-blur-radius">18 px</output>
        </div>

        <button id="btn-create-glow" class="btn btn--primary btn--wide" type="button" disabled>
          创建柔和发光
        </button>
        <p id="local-glow-status" class="local-status" role="status" aria-live="polite">
          正在检查当前图层
        </p>
      </section>

      <section class="panel__section panel__section--mock" aria-labelledby="mock-title">
        <div class="section-heading">
          <h2 id="mock-title" class="section-heading__title">开发测试（Mock）</h2>
        </div>
        <label class="field">
          <span class="field__label">本地服务地址</span>
          <input
            id="base-url"
            class="field__input"
            type="text"
            value="https://localhost:8787"
            spellcheck="false"
            autocomplete="off"
          />
        </label>
        <label class="field">
          <span class="field__label">效果名称</span>
          <input
            id="effect-label"
            class="field__input"
            type="text"
            value="金色魔法氛围"
            spellcheck="false"
            autocomplete="off"
          />
        </label>
        <div class="panel__section panel__section--actions" aria-label="Mock 操作">
        <button id="btn-plan-proxy" class="btn btn--secondary" type="button">
          规划代理图
        </button>
        <button id="btn-submit" class="btn btn--primary" type="button">
          提交任务
        </button>
        <button id="btn-cancel" class="btn btn--ghost" type="button" disabled>
          取消任务
        </button>
        <button id="btn-import" class="btn btn--secondary" type="button" disabled>
          规划导入
        </button>
        </div>

        <div class="panel__section" aria-label="进度">
        <div class="progress">
          <div class="progress__track">
            <div id="progress-bar" class="progress__bar" style="width: 0%"></div>
          </div>
          <div class="progress__meta">
            <span id="progress-stage">就绪</span>
            <span id="progress-ratio">0%</span>
          </div>
        </div>
        </div>

        <div class="panel__section" aria-label="运行日志">
        <pre id="status-log" class="log" role="log" aria-live="polite"></pre>
        </div>
      </section>
    </main>
    <script src="index.js" type="module"></script>
  </body>
</html>
